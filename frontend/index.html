<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Astera Watch: Wildfire Surface-Change Monitoring with NASA NISAR Radar" />
    <link rel="icon" type="image/svg+xml" href="/brand/astera-watch-mark-small.svg" />
    <title>Astera Watch</title>
    <script>
      // Apply the theme before first paint (no flash). Mirrors src/lib/theme/theme.ts.
      (function () {
        var pref = "system";
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var s = localStorage.getItem("astera-theme");
          pref = q === "light" || q === "dark" ? q : s === "light" || s === "dark" || s === "system" ? s : "system";
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
