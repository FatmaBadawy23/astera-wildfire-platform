<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100">
  <!-- Astera Watch product logo, C2 (primary, circular double-ring badge). Use at 48 px and above. -->
  <defs>
    <radialGradient id="aw-field" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#14224A"/><stop offset="1" stop-color="#070E21"/></radialGradient>
    <linearGradient id="aw-flame-outer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D3EC"/></linearGradient>
    <linearGradient id="aw-flame-inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C79D6"/><stop offset="1" stop-color="#6A58B0"/></linearGradient>
    <g id="aw-flame">
      <path d="M50 20 C53 30 62 36 64 46 C65 40 63 36 62 33 C69 39 72 49 70 58 C68 69 60 76 50 76 C40 76 32 69 30 58 C29 50 33 44 37 40 C37 45 39 48 42 50 C40 40 44 30 50 20 Z" fill="url(#aw-flame-outer)"/>
      <path d="M50 46 C53 53 59 57 59 64 C59 70 55 74 50 74 C45 74 41 70 41 64 C41 60 43 57 45 55 C45 58 47 60 48 61 C47 56 48 51 50 46 Z" fill="url(#aw-flame-inner)"/>
    </g>
    <path id="aw-spark" d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" fill="#FAFCFC"/>
  </defs>
  <!-- field and double ring -->
  <circle cx="50" cy="50" r="49" fill="url(#aw-field)"/>
  <circle cx="50" cy="50" r="46.2" fill="none" stroke="#516CA3" stroke-width="3.4"/>
  <circle cx="50" cy="50" r="40.6" fill="none" stroke="#445189" stroke-width="1.5"/>
  <circle cx="9.5" cy="50" r="1.1" fill="#6E90C2"/>
  <circle cx="90.5" cy="50" r="1.1" fill="#6E90C2"/>
  <!-- monogram (identical to C1), scaled 0.8 to sit inside the rings -->
  <g transform="translate(50 51.5) scale(.8) translate(-50 -52)">
    <path d="M50 22 L27 82 M50 22 L73 82" stroke="#6E90C2" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M63.7 55.6 A40 40 0 0 1 36.3 55.6" stroke="#6A58B0" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60.3 46.3 A30 30 0 0 1 39.7 46.3" stroke="#8C79D6" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".8"/>
    <g transform="translate(50 70) scale(.36) translate(-50 -50)"><use href="#aw-flame" xlink:href="#aw-flame"/></g>
    <use href="#aw-spark" xlink:href="#aw-spark" transform="translate(50 20) scale(2.1)"/>
  </g>
</svg>
